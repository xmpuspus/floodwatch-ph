# Scheduled near-real-time refresh for FloodWatch.PH.
#
# Regenerates the three public data layers, runs the pre-deploy GATE, then
# deploys + RE-ALIASES the public Vercel domain and verifies the LIVE site.
# On any failure the public alias is rolled back and a GitHub issue is filed.
#
# Cadence rationale:
#   Sentinel-1 revisit over the PH is ~6-12 days; GPM IMERG latency is
#   ~30 min to a few hours. A daily run catches every new S1 pass within a
#   day of acquisition and keeps the rainfall-context layer fresh, without
#   hammering Earth Engine. workflow_dispatch allows on-demand refresh.
#
# Security:
#   - cron + manual only. NO pull_request trigger (no fork-PR secret exposure).
#   - minimal top-level permissions; the deploy job adds issues:write only.
#   - third-party actions are SHA-pinned, not @vN.
#   - the EE service-account key is materialised to a runtime tmpfile from a
#     secret, never echoed, and shredded in an always() cleanup step.

name: refresh

on:
  schedule:
    # 18:17 UTC daily == ~02:17 PH time (off-peak, off-minute on purpose).
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Regenerate + gate only; do not deploy/re-alias"
        type: boolean
        default: false
      skip_regen:
        description: "Deploy the committed (last-good) data as-is; skip Earth Engine regeneration. Use for a code-only deploy or when the EE key is unavailable."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh-prod
  cancel-in-progress: false

jobs:
  refresh:
    name: regenerate + gate + deploy + re-alias + verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write   # the deploy_realias pager files an issue on failure
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pipeline/requirements.txt

      - name: Install pinned deps (root + pipeline)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r pipeline/requirements.txt
          # Belt-and-braces: the realtime/event/exposure modules pin these.
          pip install "earthengine-api==1.7.26" "pyproj==3.6.1" "pyyaml"

      - name: Materialise EE service-account key (never echoed)
        if: ${{ inputs.skip_regen != true }}
        run: |
          umask 077
          # $RUNNER_TEMP is a built-in env var (the `runner` context is not
          # available in a job-level env: block — that rejected the workflow).
          # Export EE_KEY_FILE for every later step (regen, cleanup).
          echo "EE_KEY_FILE=$RUNNER_TEMP/ee-key.json" >> "$GITHUB_ENV"
          printf '%s' "$EE_SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/ee-key.json"
          python -c "import json;json.load(open('$RUNNER_TEMP/ee-key.json'));print('EE key materialised and is valid JSON')"
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}

      - name: Regenerate Track A — flood_latest (Sentinel-1)
        if: ${{ inputs.skip_regen != true }}
        run: python event/flood_latest.py

      - name: Regenerate rainfall context — current_risk (GPM IMERG)
        if: ${{ inputs.skip_regen != true }}
        run: python realtime/current_risk.py

      - name: Regenerate expressway exposure — road_flood_exposure
        if: ${{ inputs.skip_regen != true }}
        run: python pipeline/road_exposure.py --refresh-osm

      - name: Pre-deploy GATE (block garbage, allow honest-empty)
        run: python scripts/gate_realtime.py

      - name: Set up Node 22 (site build)
        if: ${{ inputs.skip_deploy != true }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Set up pnpm (pinned)
        if: ${{ inputs.skip_deploy != true }}
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9.12.3

      - name: Install Playwright (for live verification)
        if: ${{ inputs.skip_deploy != true }}
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Install Vercel CLI (pinned)
        if: ${{ inputs.skip_deploy != true }}
        run: npm install -g vercel@39.1.3

      - name: Deploy + RE-ALIAS + verify LIVE (rollback + page on fail)
        if: ${{ inputs.skip_deploy != true }}
        run: |
          python scripts/deploy_realias.py \
            --site-dir site \
            --public-domain "${VERCEL_PUBLIC_DOMAIN:-floodwatch-ph.vercel.app}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_PUBLIC_DOMAIN: ${{ vars.VERCEL_PUBLIC_DOMAIN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Shred EE key (always)
        if: always()
        run: |
          if [ -f "$EE_KEY_FILE" ]; then
            shred -u "$EE_KEY_FILE" 2>/dev/null || rm -f "$EE_KEY_FILE"
            echo "EE key removed."
          fi
