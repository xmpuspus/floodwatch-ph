[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "floodwatch-ph"
dynamic = ["version"]
description = "Open-source flood-extent measurement and recurrence-prone classification for the Philippines from public satellite data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Xavier Puspus" }]
keywords = [
  "flood mapping", "Sentinel-1", "SAR", "AlphaEarth", "remote sensing",
  "civic technology", "Philippines", "disaster risk", "reproducible research",
]
dependencies = [
  "numpy==1.26.4",
  "scikit-learn==1.7.2",
  "joblib==1.5.2",
  "scipy==1.13.1",
]

[project.urls]
Homepage = "https://floodwatch.ph"
Repository = "https://github.com/xmpuspus/floodwatch-ph"

[tool.hatch.version]
path = "floodwatch_ph/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["floodwatch_ph"]
artifacts = ["model/embeddings/floodwatch_embeddings_v1.npz"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
